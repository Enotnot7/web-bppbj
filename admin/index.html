<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS BPPBJ DKI Jakarta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- ===== NETLIFY IDENTITY WIDGET (WAJIB!) ===== -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f0f2f8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background-image:
          radial-gradient(ellipse at 10% 20%, rgba(211,47,47,0.05) 0%, transparent 50%),
          radial-gradient(ellipse at 90% 80%, rgba(255,193,7,0.05) 0%, transparent 50%);
      }
      .login-box {
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        border: 1px solid rgba(255,255,255,0.3);
        text-align: center;
      }
      .login-box .badge {
        display: inline-block;
        background: #d32f2f;
        color: #fff;
        padding: 4px 18px;
        border-radius: 30px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .login-box h1 {
        font-size: 28px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 2px;
        letter-spacing: -0.02em;
      }
      .login-box h1 span { color: #d32f2f; }
      .login-box .subtitle {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 24px;
        font-weight: 500;
      }
      .login-box .loading {
        color: #475569;
        font-size: 14px;
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .login-box .loading .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e2e8f0;
        border-top-color: #d32f2f;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .login-box .footer-text {
        margin-top: 20px;
        font-size: 12px;
        color: #94a3b8;
        border-top: 1px solid rgba(0,0,0,0.04);
        padding-top: 16px;
      }
      .login-box .footer-text a {
        color: #d32f2f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-box" id="app">
      <div class="badge">🔐 Admin Panel</div>
      <h1>CMS <span>BPPBJ</span></h1>
      <p class="subtitle">DKI Jakarta</p>
      <div class="loading" id="loading">
        <span class="spinner"></span> Memuat dashboard...
      </div>
      <div class="footer-text">
        ⚡ Login via <a href="#" id="magicLinkBtn">Magic Link</a>
      </div>
    </div>

    <script>
      // ========================================
      // INIT NETLIFY IDENTITY WIDGET
      // ========================================
      (function() {
        // Tunggu Identity Widget siap
        if (window.netlifyIdentity) {
          const identity = window.netlifyIdentity;
          
          // Initialize
          identity.init({
            container: '#app',
            // Biar muncul tombol "Login with email"
            locale: 'id'
          });

          // Kalo user udah login, redirect ke dashboard
          identity.on('login', function(user) {
            console.log('✅ Login success:', user.email);
            window.location.href = '/admin/#/';
          });

          // Kalo user logout, refresh halaman
          identity.on('logout', function() {
            window.location.reload();
          });

          // Kalo ada invite token di URL, handle otomatis
          if (window.location.hash && window.location.hash.includes('invite_token')) {
            console.log('🔑 Token detected, handling invite...');
            identity.on('login', function(user) {
              console.log('✅ Invite accepted!', user.email);
              window.location.href = '/admin/#/';
            });
          }

          console.log('✅ Identity Widget ready!');
        } else {
          console.error('❌ Netlify Identity Widget not loaded!');
          document.getElementById('loading').innerHTML = '⚠️ Gagal memuat Identity Widget. Coba refresh.';
        }
      })();

      // ========================================
      // MAGIC LINK - TAMPILKAN WIDGET LOGIN
      // ========================================
      document.addEventListener('DOMContentLoaded', function() {
        const magicBtn = document.getElementById('magicLinkBtn');
        if (magicBtn) {
          magicBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (window.netlifyIdentity) {
              // Buka popup login dari Identity Widget
              window.netlifyIdentity.open('login');
            } else {
              alert('Identity Widget belum siap. Refresh halaman.');
            }
          });
        }

        // Kalo udah ada token di URL, langsung process
        if (window.location.hash && window.location.hash.includes('invite_token')) {
          setTimeout(function() {
            if (window.netlifyIdentity) {
              console.log('🔄 Processing invite token...');
              // Identity Widget otomatis handle
            }
          }, 1000);
        }
      });
    </script>

    <!-- ===== DECAP CMS (VERSI TERBARU) ===== -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
