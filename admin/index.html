<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS BPPBJ DKI Jakarta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Style untuk Login Page -->
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f0f2f8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background-image:
          radial-gradient(ellipse at 10% 20%, rgba(211, 47, 47, 0.05) 0%, transparent 50%),
          radial-gradient(ellipse at 90% 80%, rgba(255, 193, 7, 0.05) 0%, transparent 50%);
      }
      .login-box {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        text-align: center;
        transition: all 0.3s ease;
      }
      .login-box:hover {
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.12);
      }
      .login-box .badge {
        display: inline-block;
        background: #d32f2f;
        color: #fff;
        padding: 4px 18px;
        border-radius: 30px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .login-box h1 {
        font-size: 28px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 2px;
        letter-spacing: -0.02em;
      }
      .login-box h1 span {
        color: #d32f2f;
        position: relative;
      }
      .login-box h1 span::after {
        content: "";
        position: absolute;
        bottom: 2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: #d32f2f;
        border-radius: 4px;
        opacity: 0.2;
      }
      .login-box .subtitle {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 24px;
        font-weight: 500;
      }
      .login-box .loading {
        color: #475569;
        font-size: 14px;
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .login-box .loading .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e2e8f0;
        border-top-color: #d32f2f;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .login-box .footer-text {
        margin-top: 20px;
        font-size: 12px;
        color: #94a3b8;
        border-top: 1px solid rgba(0, 0, 0, 0.04);
        padding-top: 16px;
      }
      .login-box .footer-text a {
        color: #d32f2f;
        font-weight: 600;
        text-decoration: none;
      }
      .login-box .footer-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="badge">🔐 Admin Panel</div>
      <h1>CMS <span>BPPBJ</span></h1>
      <p class="subtitle">DKI Jakarta</p>
      <div class="loading">
        <span class="spinner"></span> Memuat dashboard...
      </div>
      <div class="footer-text">
        <span>💡 Login dengan <a href="#">Magic Link</a> atau <a href="#">Email</a></span>
      </div>
    </div>

    <!-- ===== DECAP CMS (VERSI BARU) ===== -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
