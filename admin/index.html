<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS BPPBJ DKI Jakarta</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f0f2f8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .login-box {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        text-align: center;
      }
      .login-box h1 {
        font-size: 28px;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .login-box h1 span {
        color: #d32f2f;
      }
      .login-box p {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 24px;
      }
      .login-box .badge {
        display: inline-block;
        background: #d32f2f;
        color: #fff;
        padding: 4px 16px;
        border-radius: 30px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .login-box .loading {
        color: #475569;
        font-size: 14px;
        margin-top: 16px;
      }
      .login-box .loading .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e2e8f0;
        border-top-color: #d32f2f;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 10px;
        vertical-align: middle;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="badge">🔐 Admin Panel</div>
      <h1>CMS <span>BPPBJ</span></h1>
      <p>DKI Jakarta</p>
      <div class="loading">
        <span class="spinner"></span> Memuat dashboard...
      </div>
    </div>

    <!-- Netlify CMS Script -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  </body>
</html>
